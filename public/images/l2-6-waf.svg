<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" style="background:#0a0b0d;font-family:'Share Tech Mono',monospace;">
  <text x="400" y="28" text-anchor="middle" fill="#28c840" font-size="13" letter-spacing="3">WEB APPLICATION FIREWALL — TRAFFIC ANALYSIS</text>

