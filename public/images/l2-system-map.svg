<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" style="background:#060d04;font-family:'JetBrains Mono',monospace">
  <defs>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#28c840" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#e5341a" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
    <marker id="arr-y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#f5a623" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="22" text-anchor="middle" font-size="11" fill="#28c840" letter-spacing="2" font-weight="700">FLOWPAY SYSTEM ARCHITECTURE — IDENTIFY THE PROBLEM NODE</text>

  <!-- USERS -->
  <rect x="20" y="130" width="80" height="50" rx="5" fill="#0a1a08" stroke="#28c840" stroke-width="1.5"/>
  <text x="60" y="150" text-anchor="middle" font-size="10" fill="#28c840" font-weight="700">USERS</text>
  <text x="60" y="166" text-anchor="middle" font-size="9" fill="#28c840" opacity="0.6">requests</text>

  <!-- Arrow Users → A -->
  <line x1="101" y1="155" x2="148" y2="155" stroke="#28c840" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <!-- NODE A — Load Balancer -->
  <rect x="150" y="110" width="130" height="90" rx="6" fill="#0a0f1a" stroke="#4a90d9" stroke-width="2"/>
  <text x="215" y="135" text-anchor="middle" font-size="20" fill="#4a90d9" font-weight="900">A</text>
  <text x="215" y="153" text-anchor="middle" font-size="11" fill="#4a90d9" font-weight="700">LOAD BALANCER</text>
  <text x="215" y="168" text-anchor="middle" font-size="9" fill="#4a90d9" opacity="0.7">Traffic Distribution</text>
  <text x="215" y="192" text-anchor="middle" font-size="8" fill="#4a90d9" opacity="0.4">Round Robin · Health Check</text>

  <!-- Arrow A → B -->
  <line x1="281" y1="145" x2="328" y2="145" stroke="#28c840" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <line x1="281" y1="165" x2="328" y2="215" stroke="#28c840" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <!-- NODE B — App Cluster -->
  <rect x="330" y="100" width="130" height="90" rx="6" fill="#0a1a08" stroke="#28c840" stroke-width="2"/>
  <text x="395" y="125" text-anchor="middle" font-size="20" fill="#28c840" font-weight="900">B</text>
  <text x="395" y="143" text-anchor="middle" font-size="11" fill="#28c840" font-weight="700">APP CLUSTER</text>
  <text x="395" y="158" text-anchor="middle" font-size="9" fill="#28c840" opacity="0.7">Business Logic</text>
  <text x="395" y="182" text-anchor="middle" font-size="8" fill="#28c840" opacity="0.4">3 Instances · Auto-scale</text>

  <!-- NODE C — Database -->
  <rect x="330" y="215" width="130" height="90" rx="6" fill="#0a1a08" stroke="#f5a623" stroke-width="2"/>
  <text x="395" y="240" text-anchor="middle" font-size="20" fill="#f5a623" font-weight="900">C</text>
  <text x="395" y="258" text-anchor="middle" font-size="11" fill="#f5a623" font-weight="700">DATABASE</text>
  <text x="395" y="273" text-anchor="middle" font-size="9" fill="#f5a623" opacity="0.7">Postgres · Primary</text>
  <text x="395" y="295" text-anchor="middle" font-size="8" fill="#f5a623" opacity="0.4">Reads + Writes · IOPS</text>

  <!-- Arrow B → D -->
  <line x1="461" y1="145" x2="508" y2="155" stroke="#28c840" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <!-- Arrow B → C -->
  <line x1="395" y1="191" x2="395" y2="213" stroke="#28c840" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <!-- NODE D — External API Gateway -->
  <rect x="510" y="110" width="160" height="100" rx="6" fill="#0a0f1a" stroke="#e5341a" stroke-width="2"/>
  <text x="590" y="138" text-anchor="middle" font-size="20" fill="#e5341a" font-weight="900">D</text>
  <text x="590" y="156" text-anchor="middle" font-size="11" fill="#e5341a" font-weight="700">EXT. API GATEWAY</text>
  <text x="590" y="171" text-anchor="middle" font-size="9" fill="#e5341a" opacity="0.7">Payments · Auth · Email</text>
  <text x="590" y="199" text-anchor="middle" font-size="8" fill="#e5341a" opacity="0.4">Stripe · SendGrid · OAuth</text>

  <!-- Legend -->
  <rect x="20" y="285" width="660" height="45" rx="4" fill="#080f06" stroke="#1a3010" stroke-width="1"/>
  <text x="350" y="303" text-anchor="middle" font-size="10" fill="#28c840" opacity="0.8">LEGEND: Each round highlights ONE faulty node. Identify it to unlock Deploy / Delay.</text>
  <text x="350" y="320" text-anchor="middle" font-size="10" fill="#4a90d9">A = Load Balancer &nbsp;&nbsp; B = App Cluster &nbsp;&nbsp; C = Database &nbsp;&nbsp; D = External API Gateway</text>
</svg>
