<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" style="background:#0a0b0d;font-family:'Share Tech Mono',monospace;">
  <text x="400" y="30" text-anchor="middle" fill="#28c840" font-size="13" letter-spacing="3">SYSTEM TELEMETRY DASHBOARD — LIVE</text>

  <!-- CPU Graph (normal) -->
  <rect x="40" y="50" width="340" height="160" rx="4" fill="#0e1117" stroke="#28c840" stroke-width="1.5"/>
  <text x="210" y="72" text-anchor="middle" fill="#28c840" font-size="11" letter-spacing="2">CPU UTILIZATION</text>
  <!-- Grid lines -->
  <line x1="60" y1="85" x2="365" y2="85" stroke="#1a2e10" stroke-width="0.5"/>
  <line x1="60" y1="110" x2="365" y2="110" stroke="#1a2e10" stroke-width="0.5"/>
  <line x1="60" y1="135" x2="365" y2="135" stroke="#1a2e10" stroke-width="0.5"/>
  <line x1="60" y1="160" x2="365" y2="160" stroke="#1a2e10" stroke-width="0.5"/>
  <!-- Y axis labels -->
  <text x="55" y="88" text-anchor="end" fill="#3a5025" font-size="8">100%</text>
  <text x="55" y="113" text-anchor="end" fill="#3a5025" font-size="8">75%</text>
  <text x="55" y="138" text-anchor="end" fill="#3a5025" font-size="8">50%</text>
  <text x="55" y="163" text-anchor="end" fill="#3a5025" font-size="8">25%</text>
  <!-- CPU line (normal fluctuating) -->
  <polyline points="65,148 90,142 115,150 140,138 165,145 190,140 215,148 240,135 265,142 290,138 315,145 340,140 365,143"
    fill="none" stroke="#28c840" stroke-width="2"/>
  <text x="210" y="195" text-anchor="middle" fill="#28c840" font-size="10">✓ NORMAL — Fluctuating 35-50%</text>

  <!-- MEMORY Graph (leak pattern - rising) -->
  <rect x="420" y="50" width="340" height="160" rx="4" fill="#0e1117" stroke="#e5341a" stroke-width="2"/>
  <text x="590" y="72" text-anchor="middle" fill="#e5341a" font-size="11" letter-spacing="2">MEMORY UTILIZATION</text>
  <!-- Grid lines -->
  <line x1="440" y1="85" x2="745" y2="85" stroke="#2e1010" stroke-width="0.5"/>
  <line x1="440" y1="110" x2="745" y2="110" stroke="#2e1010" stroke-width="0.5"/>
  <line x1="440" y1="135" x2="745" y2="135" stroke="#2e1010" stroke-width="0.5"/>
  <line x1="440" y1="160" x2="745" y2="160" stroke="#2e1010" stroke-width="0.5"/>
  <!-- Y axis labels -->
  <text x="435" y="88" text-anchor="end" fill="#7a2010" font-size="8">100%</text>
  <text x="435" y="113" text-anchor="end" fill="#7a2010" font-size="8">75%</text>
  <text x="435" y="138" text-anchor="end" fill="#7a2010" font-size="8">50%</text>
  <text x="435" y="163" text-anchor="end" fill="#7a2010" font-size="8">25%</text>
  <!-- Memory line (steadily rising - leak pattern) -->
  <polyline points="445,185 470,178 495,171 520,163 545,155 570,146 595,137 620,127 645,116 670,105 695,93 720,87 745,84"
    fill="none" stroke="#e5341a" stroke-width="2.5"/>
  <!-- Fill under curve -->
  <polygon points="445,190 445,185 470,178 495,171 520,163 545,155 570,146 595,137 620,127 645,116 670,105 695,93 720,87 745,84 745,190"
    fill="#e5341a" opacity="0.08"/>
  <!-- CRASH indicator -->
  <line x1="745" y1="84" x2="765" y2="84" stroke="#e5341a" stroke-width="2" stroke-dasharray="3,2"/>
  <text x="770" y="88" fill="#e5341a" font-size="10">CRASH</text>
  <text x="590" y="205" text-anchor="middle" fill="#e5341a" font-size="10">⚠ RISING — Never releases memory!</text>

  <!-- Time axis labels -->
  <text x="65" y="218" fill="#3a5025" font-size="8">T+0h</text>
  <text x="180" y="218" fill="#3a5025" font-size="8">T+1h</text>
  <text x="295" y="218" fill="#3a5025" font-size="8">T+2h</text>
  <text x="445" y="218" fill="#7a2010" font-size="8">T+0h</text>
  <text x="545" y="218" fill="#7a2010" font-size="8">T+1h</text>
  <text x="645" y="218" fill="#7a2010" font-size="8">T+2h</text>
  <text x="720" y="218" fill="#7a2010" font-size="8">T+3h</text>

  <!-- Stats panel -->
  <rect x="40" y="240" width="340" height="80" rx="4" fill="#0a1208" stroke="#28c840" stroke-width="1"/>
  <text x="210" y="262" text-anchor="middle" fill="#28c840" font-size="11" letter-spacing="1">CPU METRICS</text>
  <text x="70" y="282" fill="#28c840" font-size="10">Current: 43%</text>
  <text x="70" y="298" fill="#28c840" font-size="10">Peak: 52%</text>
  <text x="230" y="282" fill="#28c840" font-size="10">Avg: 41%</text>
  <text x="230" y="298" fill="#28c840" font-size="10">Status: ✓ HEALTHY</text>
  <text x="210" y="314" text-anchor="middle" fill="#3a5025" font-size="9">No anomalies detected</text>

  <rect x="420" y="240" width="340" height="80" rx="4" fill="#1a0505" stroke="#e5341a" stroke-width="1"/>
  <text x="590" y="262" text-anchor="middle" fill="#e5341a" font-size="11" letter-spacing="1">MEMORY METRICS</text>
  <text x="450" y="282" fill="#e5341a" font-size="10">Current: 91%</text>
  <text x="450" y="298" fill="#e5341a" font-size="10">Growth: +8%/hr</text>
  <text x="610" y="282" fill="#e5341a" font-size="10">Freed: 0 MB</text>
  <text x="610" y="298" fill="#e5341a" font-size="10">Status: ✕ CRITICAL</text>
  <text x="590" y="314" text-anchor="middle" fill="#7a2010" font-size="9">System crash predicted in ~4 hours</text>

  <!-- Question -->
  <text x="400" y="358" text-anchor="middle" fill="#f59e0b" font-size="12" letter-spacing="2">IDENTIFY THE SOFTWARE PHENOMENON</text>
  <rect x="200" y="368" width="400" height="40" rx="4" fill="#1a1000" stroke="#f59e0b" stroke-width="1"/>
  <text x="400" y="383" text-anchor="middle" fill="#f59e0b" font-size="10">CPU is NORMAL. Memory is RISING. System is CRASHING.</text>
  <text x="400" y="399" text-anchor="middle" fill="#7a5500" font-size="9">What software phenomenon causes this pattern?</text>
</svg>
