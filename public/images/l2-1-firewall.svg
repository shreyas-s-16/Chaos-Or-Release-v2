<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" style="background:#0a0b0d;font-family:'Share Tech Mono',monospace;">
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" fill="#28c840" font-size="13" letter-spacing="3">NETWORK TRAFFIC FLOW DIAGRAM</text>

  <!-- Laptop -->
  <rect x="40" y="160" width="100" height="70" rx="6" fill="#141820" stroke="#28c840" stroke-width="1.5"/>
  <rect x="30" y="228" width="120" height="8" rx="2" fill="#141820" stroke="#28c840" stroke-width="1"/>
  <rect x="55" y="170" width="70" height="45" rx="2" fill="#0a1208" stroke="#28c840" stroke-width="1"/>
  <text x="90" y="197" text-anchor="middle" fill="#28c840" font-size="9">▊▊▊▊</text>
  <text x="90" y="208" text-anchor="middle" fill="#3a5025" font-size="8">USER</text>
  <text x="90" y="255" text-anchor="middle" fill="#28c840" font-size="10">LAPTOP</text>

  <!-- Arrow 1: Laptop → ? -->
  <line x1="152" y1="195" x2="230" y2="195" stroke="#28c840" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="228,190 240,195 228,200" fill="#28c840"/>
  <text x="191" y="185" text-anchor="middle" fill="#28c840" font-size="9">TRAFFIC</text>
  <text x="191" y="210" text-anchor="middle" fill="#3a5025" font-size="8">REQUEST</text>

  <!-- MISSING COMPONENT ? -->
  <rect x="240" y="155" width="110" height="80" rx="6" fill="#1a0a0a" stroke="#e5341a" stroke-width="2.5" stroke-dasharray="8,4"/>
  <text x="295" y="193" text-anchor="middle" fill="#e5341a" font-size="40" font-weight="bold">?</text>
  <text x="295" y="220" text-anchor="middle" fill="#e5341a" font-size="10" letter-spacing="2">MISSING</text>
  <!-- Pulsing effect rings -->
  <circle cx="295" cy="195" r="48" fill="none" stroke="#e5341a" stroke-width="0.5" opacity="0.3"/>
  <circle cx="295" cy="195" r="58" fill="none" stroke="#e5341a" stroke-width="0.3" opacity="0.15"/>

  <!-- BLOCKED indicator -->
  <line x1="352" y1="175" x2="390" y2="175" stroke="#e5341a" stroke-width="2"/>
  <line x1="352" y1="215" x2="390" y2="215" stroke="#e5341a" stroke-width="2"/>
  <text x="371" y="193" text-anchor="middle" fill="#e5341a" font-size="18">✕</text>
  <text x="371" y="207" text-anchor="middle" fill="#e5341a" font-size="8">BLOCKED</text>

  <!-- Arrow 2: ? → Web Server (dashed/blocked) -->
  <line x1="390" y1="195" x2="490" y2="195" stroke="#e5341a" stroke-width="2" stroke-dasharray="4,4" opacity="0.5"/>
  <polygon points="488,190 500,195 488,200" fill="#e5341a" opacity="0.5"/>

  <!-- Web Server -->
  <rect x="500" y="140" width="120" height="110" rx="6" fill="#141820" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="510" y="152" width="100" height="10" rx="2" fill="#0a1535" stroke="#3b82f6" stroke-width="1"/>
  <rect x="510" y="168" width="100" height="10" rx="2" fill="#0a1535" stroke="#3b82f6" stroke-width="1"/>
  <rect x="510" y="184" width="100" height="10" rx="2" fill="#0a1535" stroke="#3b82f6" stroke-width="1"/>
  <circle cx="518" cy="157" r="3" fill="#e5341a"/>
  <circle cx="528" cy="157" r="3" fill="#f59e0b"/>
  <circle cx="538" cy="157" r="3" fill="#28c840"/>
  <text x="560" y="215" text-anchor="middle" fill="#3b82f6" font-size="9">PORT 80 / 443</text>
  <text x="560" y="232" text-anchor="middle" fill="#3b82f6" font-size="11" letter-spacing="1">WEB SERVER</text>

  <!-- Status boxes -->
  <rect x="40" y="310" width="160" height="55" rx="4" fill="#0a1208" stroke="#28c840" stroke-width="1"/>
  <text x="120" y="328" text-anchor="middle" fill="#28c840" font-size="10" letter-spacing="1">STATUS</text>
  <text x="120" y="344" text-anchor="middle" fill="#28c840" font-size="11">● SENDING</text>
  <text x="120" y="358" text-anchor="middle" fill="#3a5025" font-size="9">Packets leaving laptop</text>

  <rect x="240" y="310" width="160" height="55" rx="4" fill="#1a0505" stroke="#e5341a" stroke-width="1"/>
  <text x="320" y="328" text-anchor="middle" fill="#e5341a" font-size="10" letter-spacing="1">STATUS</text>
  <text x="320" y="344" text-anchor="middle" fill="#e5341a" font-size="11">✕ BLOCKED</text>
  <text x="320" y="358" text-anchor="middle" fill="#7a2010" font-size="9">Unknown component</text>

  <rect x="450" y="310" width="160" height="55" rx="4" fill="#0a0a1a" stroke="#3b82f6" stroke-width="1"/>
  <text x="530" y="328" text-anchor="middle" fill="#3b82f6" font-size="10" letter-spacing="1">STATUS</text>
  <text x="530" y="344" text-anchor="middle" fill="#3b82f6" font-size="11">○ WAITING</text>
  <text x="530" y="358" text-anchor="middle" fill="#1a3060" font-size="9">No traffic received</text>

  <!-- Safety First badge -->
  <rect x="620" y="155" width="150" height="90" rx="4" fill="#1a0a00" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="695" y="178" text-anchor="middle" fill="#f59e0b" font-size="10" letter-spacing="2">⚠ ALERT</text>
  <text x="695" y="196" text-anchor="middle" fill="#f59e0b" font-size="10">"Safety First"</text>
  <text x="695" y="212" text-anchor="middle" fill="#f59e0b" font-size="10">update applied</text>
  <text x="695" y="228" text-anchor="middle" fill="#7a5500" font-size="9">All traffic blocked</text>

  <!-- Question label -->
  <text x="295" y="130" text-anchor="middle" fill="#e5341a" font-size="12" letter-spacing="2">IDENTIFY THE MISSING COMPONENT</text>
  <text x="295" y="148" text-anchor="middle" fill="#7a2010" font-size="10">Traffic is blocked here ↓</text>
</svg>
